<!DOCTYPE html>
<html>
<head>
  <title>Amazing Facts Search Engine</title>
</head>
<body>
  <h1>🚀 My Search Engine</h1>
  <input type="text" id="query" placeholder="Kuch bhi search karo...">
  <button onclick="search()">Search</button>
  <div id="result"></div>

  <script>
    function search() {
      var q = document.getElementById('query').value;
      // Yahan apna wo URL paste karo jo tumhe abhi mila hai
      var webAppUrl = "https://script.google.com/macros/s/AKfycbzP6_4-SqzZXbA8lsRQP8vlx-i72mlpJg0moNO4OSUiKaHRtTvfloPfs5vr4IUa2wrh/exec"; 
      
      document.getElementById('result').innerText = "Searching...";
      
      fetch(webAppUrl + "?q=" + encodeURIComponent(q))
        .then(response => response.json())
        .then(data => {
           document.getElementById('result').innerText = JSON.stringify(data);
        });
    }
  </script>
</body>
</html>
